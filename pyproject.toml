[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speculative-branch-pruning-mesh"
version = "0.1.0"
description = "Tree-of-thought speculative branch pruner terminating low-probability reasoning branches based on intermediate reward scores"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
speculative-branch-pruning-mesh = "speculative_branch_pruning_mesh.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["speculative_branch_pruning_mesh*"]
